<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界経済サイト(仮称)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-modal" class="modal">
        <div class="modal-content">
            <h2>【所持金を入力してください。】</h2>
            <input type="number" id="initial-money-input" placeholder="金額を入力">
            <button id="start-btn">開始</button>
        </div>
    </div>

    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2>購入結果</h2>
            <textarea id="result-text" readonly></textarea>
            <button id="copy-btn">結果をコピー</button>
            <button id="close-result-btn">閉じる</button>
        </div>
    </div>

    <header>
        <div class="header-left">
            <h1>世界経済サイト(仮称)</h1>
            <p>今いる所: <span id="current-country-display">未選択</span></p>
        </div>
        <div class="header-right">
            <p>所持金: <span id="money-display">0</span></p>
            <p>使用金額: <span id="spent-display">0</span></p>
            <button id="finish-btn">買い物を終了して結果を見る</button>
        </div>
    </header>

    <div class="container">
        <aside id="country-list">
            </aside>

        <main id="item-grid">
            </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
